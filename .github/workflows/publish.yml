# Publish to PyPI when a GitHub release is published (tag like v0.2.0).
#
# Uses PyPI Trusted Publishing: no API token is stored anywhere. One-time
# setup on pypi.org -> your account -> Publishing -> "Add a new pending
# publisher": owner Muriel-AI-Inc, repository muriel-sdk-python, workflow
# publish.yml, environment pypi.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests
      - name: Version matches the tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "pyproject version $v != tag ${GITHUB_REF_NAME}"; exit 1; }
          python -c "import muriel,sys; sys.exit(muriel.__version__ != '$v')"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
